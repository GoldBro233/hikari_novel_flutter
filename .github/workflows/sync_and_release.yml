name: Sync Upstream, Build and Release APK

on:
  schedule:
    - cron: "0 0 * * *" # 每天执行一次
  workflow_dispatch:
    inputs:
      branch:
        description: '选择要构建的分支'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - refactor/reader-optimization

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    # 赋予推送到仓库的权限
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}
          fetch-depth: 0 # 必须设置为 0，拉取完整的历史记录以便进行 Git 合并

      - name: Configure Git
        # 配置 Git 机器人账号，用于自动提交合并记录
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync with Upstream
        id: sync
        # 【重要】将下面的 URL 替换为主仓库的真实地址
        run: |
          BRANCH="${{ github.event.inputs.branch || 'main' }}"
          echo "当前构建分支: $BRANCH"

          git remote add upstream https://github.com/15dd/hikari_novel_flutter.git
          git fetch upstream $BRANCH

          # 计算主仓库比当前仓库多了多少个提交
          NEW_COMMITS=$(git rev-list HEAD..upstream/$BRANCH --count)

          if [ "$NEW_COMMITS" -eq 0 ]; then
            echo "主仓库没有更新，跳过后续步骤。"
            echo "has_update=false" >> $GITHUB_OUTPUT
          else
            echo "发现主仓库有 $NEW_COMMITS 个新提交！准备合并..."
            echo "has_update=true" >> $GITHUB_OUTPUT

            # 执行合并，保留我们自己的 workflow 文件
            git merge upstream/$BRANCH --no-edit

            # 将合并后的代码推送到你的仓库
            git push origin $BRANCH
          fi

      - name: Check Last Build Time
        id: check_build
        # 检查上次成功构建的时间，如果超过13天则强制重新构建
        run: |
          LAST_SUCCESS=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/sync_and_release.yml/runs?status=success&per_page=1" \
            | jq -r '.workflow_runs[0].updated_at // empty')

          if [ -z "$LAST_SUCCESS" ]; then
            echo "没有找到上次成功的构建记录，将执行构建"
            echo "need_refresh=true" >> $GITHUB_OUTPUT
          else
            LAST_TIME=$(date -d "$LAST_SUCCESS" +%s)
            CURRENT_TIME=$(date +%s)
            DAYS_DIFF=$(( ($CURRENT_TIME - $LAST_TIME) / 86400 ))

            echo "距离上次成功构建已经过去 $DAYS_DIFF 天"

            if [ $DAYS_DIFF -ge 13 ]; then
              echo "超过13天未构建，需要刷新构建文件"
              echo "need_refresh=true" >> $GITHUB_OUTPUT
            else
              echo "构建文件仍在有效期内"
              echo "need_refresh=false" >> $GITHUB_OUTPUT
            fi
          fi

      # ================= 下面是构建和发布步骤 =================

      - name: Get Upstream Version
        id: version
        # 获取上游仓库的最新 Release 版本号
        run: |
          VERSION=$(curl -s https://api.github.com/repos/15dd/hikari_novel_flutter/releases/latest | jq -r .tag_name)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "无法获取上游版本号，使用日期作为后备"
            VERSION="build-$(date +'%Y%m%d')"
          fi
          echo "上游最新版本: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # 处理分支名，将 / 替换为 - 以避免文件系统问题
          BRANCH="${{ github.event.inputs.branch || 'main' }}"
          SAFE_BRANCH="${BRANCH//\//-}"
          echo "安全分支名: $SAFE_BRANCH"
          echo "safe_branch=$SAFE_BRANCH" >> $GITHUB_OUTPUT

      - name: Set up Java
        # 在以下情况执行构建：1) 有上游更新 2) 手动触发 3) 超过13天需要刷新
        if: ${{ steps.sync.outputs.has_update == 'true' || github.event_name == 'workflow_dispatch' || steps.check_build.outputs.need_refresh == 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        if: ${{ steps.sync.outputs.has_update == 'true' || github.event_name == 'workflow_dispatch' || steps.check_build.outputs.need_refresh == 'true' }}
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Cache Pub dependencies
        if: ${{ steps.sync.outputs.has_update == 'true' || github.event_name == 'workflow_dispatch' || steps.check_build.outputs.need_refresh == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle dependencies
        if: ${{ steps.sync.outputs.has_update == 'true' || github.event_name == 'workflow_dispatch' || steps.check_build.outputs.need_refresh == 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Accept Android Licenses
        if: ${{ steps.sync.outputs.has_update == 'true' || github.event_name == 'workflow_dispatch' || steps.check_build.outputs.need_refresh == 'true' }}
        run: yes | flutter doctor --android-licenses

      - name: Install dependencies
        if: ${{ steps.sync.outputs.has_update == 'true' || github.event_name == 'workflow_dispatch' || steps.check_build.outputs.need_refresh == 'true' }}
        run: flutter pub get

      - name: Build APK
        if: ${{ steps.sync.outputs.has_update == 'true' || github.event_name == 'workflow_dispatch' || steps.check_build.outputs.need_refresh == 'true' }}
        run: flutter build apk --release

      - name: Sign APK
        if: ${{ steps.sync.outputs.has_update == 'true' || github.event_name == 'workflow_dispatch' || steps.check_build.outputs.need_refresh == 'true' }}
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: build/app/outputs/flutter-apk
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEYSTORE_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Delete Old Artifacts
        if: ${{ steps.sync.outputs.has_update == 'true' || github.event_name == 'workflow_dispatch' || steps.check_build.outputs.need_refresh == 'true' }}
        continue-on-error: true
        uses: geekyeggo/delete-artifact@v5
        with:
          name: app-release-apk-*
          useGlob: true

      - name: Upload APK to Artifacts
        if: ${{ steps.sync.outputs.has_update == 'true' || github.event_name == 'workflow_dispatch' || steps.check_build.outputs.need_refresh == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.version.outputs.version }}-${{ steps.version.outputs.safe_branch }}.apk
          path: ${{ steps.sign_apk.outputs.signedReleaseFile }}
          retention-days: 14
